openapi: 3.0.3

info:
  title: BM3 XML Workbench — 新 GUI 向け API
  version: 0.1.0
  description: |
    XML 形式の計画ファイル（BM3）を扱うツールの、画面側とサーバ側の境界を定義します。

    ## このファイルの現在の状態

    **2026-09-04 にサーバ側の I/F 一覧を受領し、それに合わせて書き直しました。**
    受領した原文は `docs/interface/received/2026-09-04-frontend-interface-list.md` にあります。

    - 🟢 が付いている操作は、**サーバ側の文書で確認できたもの**です
    - 🔴 が付いている操作は、**サーバ側で「未実装」と明記されているもの**です。
      形はこちらの想定のまま残しています。サーバ側が実装するときの叩き台であり、
      実物が決まったら差し替えます

    ## 読み方

    - 日本語の解説版は `docs/interface/21-api.md` にあります
    - 各操作の `x-ui-operations` に、**その API がどの画面操作のために存在するか**を書いています
    - 画面操作の一覧は `docs/ui/10-screens.md` にあります

    ## 前提（サーバ側の文書より）

    - 新 GUI は同じサーバの `/external/` に置かれ、`/external-host` が iframe で開く
    - API は**同一オリジン**の `/api/v1/*` を使う
    - **現時点は読み込み専用。** `GET /meta` の `writeEnabled` が `false` の間、
      画面側はサーバ側への保存を行ってはならない（画面内ドラフトに留める）
    - 計画の中身は **XML ではなく、サーバ側が変換した JSON** で受け取る。
      画面側は XML の要素名を一切知らなくてよい

  contact:
    name: 確認事項の一覧
    url: https://github.com/chidiremen/ccpm-update-support/blob/main/docs/90-open-questions.md

servers:
  - url: /api/v1
    description: |
      同一オリジン。新 GUI はこのサーバの `/external/` から配信されるため、
      ホスト名やポート番号を画面側が知る必要はない 🟢

# 認証は設けていません。サーバ側の文書にも認証の記述はありません。
# 利用者のパソコンの中だけで動く前提です (Q-007 は引き続き未確認)。
security: []

tags:
  - name: system
    description: 疎通確認とサーバ情報 🟢
  - name: portfolio
    description: 複数プロジェクトの計画を一度に読む 🟢
  - name: write
    description: 保存・更新 — **サーバ側で未実装** 🔴

paths:

  /health:
    get:
      tags: [system]
      summary: 疎通確認 🟢
      description: |
        サーバ側が動いているかを確かめます。起動時に最初に呼びます。

        確定度: 🟢 サーバ側の文書で確認済み
      operationId: getHealth
      x-ui-operations: [起動時]
      responses:
        "200":
          description: 動作している
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /meta:
    get:
      tags: [system]
      summary: サーバ情報と対応機能 🟢
      description: |
        サーバ側の名前・版・対応機能を返します。

        **`writeEnabled` がいちばん重要です。** これが `false` の間、
        画面側は保存・反映のボタンを「未実装」または「画面内ドラフト」の表示に留めます
        （UI-DIFF-09）。

        確定度: 🟢 サーバ側の文書で確認済み
      operationId: getMeta
      x-ui-operations: [起動時, UI-DIFF-09]
      responses:
        "200":
          description: サーバ側の情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /portfolio:
    get:
      tags: [portfolio]
      summary: 複数プロジェクトの計画を読む 🟢
      description: |
        **新 GUI が使う主たる API です。** サーバ側が BM3 の XML を解析し、
        画面が扱いやすい `projects / tasks / deps / critical` の形に変換して返します。

        - 複数のプロジェクトを **1 回の呼び出し**で受け取ります（`projectIds`）
        - 画面側は **XML の要素名を知らなくてよい**（サーバ側が変換済み）
        - `projectIds` を省くと全件（サーバ側の文書では 47 案件）になり**重い**。
          起動クエリから受け取った `projectIds` をそのまま渡すこと
        - 応答の `id` は `{ProjectId}:{TaskId}` の形。**画面側で作り替えてはならない**
          （依存関係とクリティカルチェーンのキーでもある）
        - `revision` は将来の保存 I/F で使う予定。**読んだら保持しておく**

        確定度: 🟢 サーバ側の文書で確認済み
      operationId: getPortfolio
      x-ui-operations: [起動時, UI-COMMON-10, UI-GANTT-01, UI-NET-01, UI-GANTT-27, UI-GANTT-28, UI-GANTT-29, UI-COMMON-08, UI-NET-18, UI-NET-19, UI-ADJ-01, UI-ADJ-02, UI-ADJ-03, UI-ADJ-04, UI-ADJ-05]
      parameters:
        - name: projectIds
          in: query
          required: false
          description: |
            表示するプロジェクトの識別子（カンマ区切り）。**指定順を保持して返る。**
            必須ではないが、省くと全件になり重いため**実質必須**。
          schema:
            type: string
          example: "17,49"
        - name: asOf
          in: query
          required: false
          description: 判定基準日（ISO 日時文字列）。省くとサーバ側の現在時刻または設定値
          schema:
            type: string
          example: "2026-09-04"
      responses:
        "200":
          description: |
            計画。**一部のプロジェクトが読めなくても 200 で返り、`errors[]` にその旨が入ります。**
            画面側は `errors[]` が空でないことを利用者に伝える必要があります（UI-COMMON-11）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              examples:
                最小:
                  externalValue: ./examples/portfolio-example.json

  /portfolio-mock:
    get:
      tags: [portfolio]
      summary: 互換エイリアス（使わない） 🟢
      deprecated: true
      description: |
        `/portfolio` と同じ応答を返す互換用の別名です。
        サーバ側の文書に「今後のフロント開発では `/portfolio` を使うこと」とあるため、
        **画面側は使いません。** 存在だけ記録しておきます。
      operationId: getPortfolioMock
      x-ui-operations: []
      responses:
        "200":
          description: "`/portfolio` と同じ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  # ------------------------------------------------------------------
  # ここから下は、サーバ側で「未実装」と明記されているものです 🔴
  #
  # サーバ側の文書（保存・更新 I/F）によると、次の操作は I/F 未確定:
  #   BM3 XML へのタスク追加 / BMD 生成 / BM3 アプリでの保存支援 /
  #   横断リンクの永続保存 / Quantity=0 の割り込みタスク生成 / タスク分割 / 循環承認
  #
  # 形はこちらの想定のまま残しています。サーバ側が実装するときの叩き台であり、
  # 実物が決まったら差し替えます (Q-015, Q-005, Q-014)。
  # 画面側は GET /meta の writeEnabled を見て、false の間はこれらを呼びません。
  # ------------------------------------------------------------------

  /plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    put:
      tags: [write]
      summary: 計画を保存する（未実装） 🔴
      x-status: 未実装（サーバ側で確認済み）
      description: |
        画面側でためた変更をサーバ側へ送り、BM3 側へ反映してもらう想定。

        ⚠️ **サーバ側で未実装です。** `writeEnabled=false` の間は呼びません。
        本文の形（JSON で差分を送るのか、全文を送るのか）も未定です (Q-015)。
        `If-Match` による版の照合は、`revision` が応答に含まれていることから
        **できる可能性が高い**が未確認です (Q-005)。

        確定度: 🔴 未実装
      operationId: savePlan
      x-ui-operations: [UI-DIFF-03]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: "`GET /portfolio` で受け取った `revision`"
          schema:
            type: string
          example: "bm3-2-..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
      responses:
        "200":
          description: 保存できた。新しい版が返る
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    type: string
        "409":
          description: 版が食い違った（他の人が先に保存した）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
              examples:
                衝突:
                  externalValue: ./examples/conflict-error.json
        "422":
          $ref: "#/components/responses/UnprocessablePlan"
        "500":
          $ref: "#/components/responses/InternalError"

  /plans/{planId}/validate:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [write]
      summary: 保存せずに検証する（未実装） 🔴
      x-status: 未実装（サーバ側で確認済み）
      description: |
        保存の前に、計画の妥当性をサーバ側に確かめてもらう想定。

        ⚠️ **サーバ側で未実装です** (Q-014)。
        画面側でできる検証（依存の循環など）は画面側で行っています。

        確定度: 🔴 未実装
      operationId: validatePlan
      x-ui-operations: [UI-DIFF-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRequest"
      responses:
        "200":
          description: 検証結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
              examples:
                警告あり:
                  externalValue: ./examples/validation-result.json
        "500":
          $ref: "#/components/responses/InternalError"

components:

  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      description: |
        `GET /portfolio` の応答にある `planId`。現時点の値は常に `bm3-portfolio` 🟢
      schema:
        type: string
      example: "bm3-portfolio"

  schemas:

    Meta:
      type: object
      description: "`GET /meta` の応答 🟢"
      required: [server, version, capabilities, writeEnabled]
      properties:
        server:
          type: string
          example: "bm3-xml-workbench"
        version:
          type: string
          example: "0.1.0"
        capabilities:
          type: array
          description: |
            対応機能の名前の一覧。受領時点の値は
            `["portfolio-mock-read", "bm3-xml-derived-json"]`。
            画面側は名前で判定せず、`writeEnabled` だけを見る（名前の意味が未確認のため）
          items:
            type: string
        writeEnabled:
          type: boolean
          description: |
            **`false` の間、画面側はサーバ側への保存・反映を行ってはならない。**
            保存ボタンは「未実装」または「画面内ドラフト」の表示に留める（UI-DIFF-09）
          example: false

    Portfolio:
      type: object
      description: "`GET /portfolio` の応答 🟢"
      required: [planId, revision, projects, tasks, deps, critical, today, errors]
      properties:
        planId:
          type: string
          description: 現時点は常に `bm3-portfolio`
          example: "bm3-portfolio"
        revision:
          type: string
          description: |
            版の印。**将来の保存 I/F で使う予定なので、読んだら保持する。**
            形式は未確認（受領した文書でも `bm3-2-...` と省略されていた）
          example: "bm3-2-..."
        sourcePath:
          type: string
          description: サーバ側が読んだ XML の置き場所（表示用。画面側は解釈しない）
          example: "C:\\...\\bm3-xml-workbench\\raw"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        tasks:
          type: array
          description: |
            タスク・マイルストン・バッファのすべて。バッファは `kind=buffer` として混ざる
            （元は BM3 の `MilestoneBuffer`）
          items:
            $ref: "#/components/schemas/Task"
        deps:
          type: array
          items:
            $ref: "#/components/schemas/Dep"
        critical:
          type: array
          description: クリティカルチェーン上のタスクの `id` の一覧。**サーバ側が決める**（画面側は計算しない）
          items:
            type: string
          example: ["17:1", "17:158"]
        today:
          type: string
          description: 判定基準日（`asOf` を反映した値）。画面の「今日」の線はこれを使う
          example: "2026-09-04"
        errors:
          type: array
          description: |
            一部のプロジェクトの XML 解析に失敗したときに入る。**空なら正常。**
            空でなければ、そのプロジェクトは応答に含まれていない。利用者に伝えること（UI-COMMON-11）
          items:
            $ref: "#/components/schemas/ParseError"

    Project:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          description: BM3 の ProjectId
          example: "17"
        name:
          type: string
          example: "BEV step3 AMP"
        color:
          type: string
          description: 表示用の色。**サーバ側が決める**（画面側で割り当てない）
          example: "#4a7fd0"

    Task:
      type: object
      description: |
        タスク 1 件。項目の意味と「中核 / 素通し」の区分は
        `docs/interface/20-data-model.md` と `docs/interface/24-field-catalog.md` にあります。
      required: [id, projectId, name, kind, parentId, duration, start, finish, progress, assignees]
      properties:
        id:
          type: string
          description: "画面内のタスク ID。形式は `{ProjectId}:{TaskId}`。**画面側で作り替えない**"
          example: "17:194"
        sourceProjectId:
          type: string
          description: 元の BM3 ProjectId
          example: "17"
        sourceTaskId:
          type: string
          description: 元の BM3 TaskId。バッファ行では無いことがある
          example: "194"
        sourceBufferId:
          type: string
          description: BM3 の MilestoneBuffer 由来の行だけが持つ
        name:
          type: string
          example: "HILS：マイルストーン集約タスク"
        kind:
          type: string
          enum: [task, milestone, buffer]
          description: 表示上の種別。**判定は暫定**（BM3 の TaskType と期間ゼロから推定）
        parentId:
          type: string
          nullable: true
          description: 親タスクの `id`。最上位は `null`
          example: "17:158"
        projectId:
          type: string
          description: 所属プロジェクト
          example: "17"
        duration:
          type: number
          description: 期間（**営業日**）。BM3 の分単位の値を `MinutesPerDay` で換算したもの。土日を飛ばして数える 🟡 (Q-016 ✅、祝日は Q-041)
          example: 3
        start:
          type: string
          format: date
          example: "2024-11-20"
        finish:
          type: string
          format: date
          example: "2024-11-22"
        progress:
          type: number
          description: "進捗率 0〜100。**暫定値**（`(duration - remainder) / duration` 由来。BM3 の正式な進捗率ではない）"
          example: 100
        assignees:
          type: array
          description: |
            割り当てられた資源の名前。**BM3 の Skill 名**（資源の種類）。複数あり得る。
            リソース調整の対象は Skill でよいと決まった (Q-039 ✅)
          items:
            type: string
          example: ["サウンドPAVCT"]
        wbsCode:
          type: string
          description: BM3 の Task Code
          example: "194"
        priority:
          type: string
          description: "**暫定表示。** クリティカルなら `高`、それ以外は `中`"
          example: "中"
        phase:
          type: string
          description: 現時点は常に空
          example: ""
        note:
          type: string
          description: BM3 の Memo、またはバッファの情報
        createdAt:
          type: string
          description: プロジェクトの AsOfDate 由来（タスク個別の値ではない）
        updatedAt:
          type: string
          description: プロジェクトの AsOfDate 由来（タスク個別の値ではない）
        consumed:
          type: number
          description: "`kind=buffer` のときのバッファ消費。単位は**日** 🟡 (Q-038 ✅)"
        protects:
          type: string
          description: "`kind=buffer` のときの保護対象。現時点は DependencyId"

    Dep:
      type: object
      description: 依存関係。種類や遅延の指定は無い（終了→開始のみ） 🟢
      required: [from, to]
      properties:
        from:
          type: string
          description: 先行タスクの `id`
          example: "17:194"
        to:
          type: string
          description: 後続タスクの `id`
          example: "17:159"

    ParseError:
      type: object
      required: [projectId, message]
      properties:
        projectId:
          type: string
          example: "99"
        message:
          type: string
          example: "No XML file found ..."

    # ---- 以下は未実装の保存 I/F 用（こちらの想定）🔴 ----

    SaveRequest:
      type: object
      description: |
        ⚠️ **こちらの想定です。** サーバ側の保存 I/F は未実装で、
        差分を送るのか全文を送るのかも決まっていません (Q-015)。
        画面側は「読み込み時点との差分」を持っているので、差分を送る形を叩き台にしています。
      properties:
        revision:
          type: string
        changes:
          type: array
          items:
            type: object
            additionalProperties: true

    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [severity, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        message:
          type: string
        taskId:
          type: string

    ErrorResponse:
      type: object
      description: |
        ⚠️ **こちらの想定です。** サーバ側の文書にはエラー応答の形の記述がありません (Q-025)。
        `GET /portfolio` は一部の失敗を 200 の `errors[]` で返すことが分かっています。
      required: [code, message]
      properties:
        code:
          type: string
          example: "REVISION_CONFLICT"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: object
              properties:
                currentRevision:
                  type: string
                expectedRevision:
                  type: string

  responses:

    UnprocessablePlan:
      description: 要求の形は正しいが、計画の中身が扱えない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: サーバ側の想定外の失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
